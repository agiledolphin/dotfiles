"$schema" = 'https://starship.rs/config-schema.json'

# ──────────────────────────────────────────────────────────────
# Starship 配置 · Catppuccin Powerline 风格
#   → "Catppuccin Powerline" 指布局预设（分段/箭头结构），与配色无关
#   → 默认激活配色为 catppuccin_mocha；TokyoNight / Catppuccin 均可选，见下方 palette
#   → 放到 ~/.config/starship.toml
#   → 必须安装 Nerd Font，否则色块箭头与图标会变成方块
#   → 换主题：TokyoNight 系列改成 tokyonight_storm / tokyonight_moon / tokyonight_day
#            Catppuccin 系列改成 catppuccin_mocha / catppuccin_macchiato / catppuccin_frappe / catppuccin_latte
# ──────────────────────────────────────────────────────────────

# 将所有命令的超时时间扩大到 2000 毫秒（2秒）
command_timeout = 2000

palette = 'catppuccin_mocha'

# 提示符整体布局：powerline 色块单行，箭头处的 fg/bg 必须与相邻段对齐
format = """
[](red)\
$os\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
$git_state\
[](fg:yellow bg:green)\
$c\
$rust\
$zig\
$golang\
$nodejs\
$bun\
$python\
$java\
$package\
[](fg:green bg:sapphire)\
$docker_context\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

# ── 操作系统（红色段）──
[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
AOSC = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

# ── 用户名（红色段，始终显示）──
[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

# ── 主机名（红色段，仅 SSH 会话显示 @host）──
[hostname]
ssh_only = true
style = "bg:red fg:crust"
format = '[@$hostname]($style)'

# ── 当前目录（桃色段）──
[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ── Git（黄色段）──
[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'
conflicted = "=${count}"
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
untracked  = "?${count}"
stashed    = "*${count}"
modified   = "!${count}"
staged     = "+${count}"
renamed    = "»${count}"
deleted    = "✘${count}"

[git_state]
style = "bg:yellow"
format = '[[ \($state( $progress_current/$progress_total)\) ](fg:crust bg:yellow)]($style)'

# ── 语言 / 运行时（绿色段，仅相关项目目录显示）──
[c]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version(-$name)) ](fg:crust bg:green)]($style)'

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[zig]
symbol = "↯"
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[golang]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[bun]
symbol = "bun"
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\($virtualenv\)) ](fg:crust bg:green)]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'

# 包版本：默认关闭，需要时把 disabled 改成 false
[package]
symbol = "󰏗 "
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'
disabled = true

# ── Docker（天蓝段）──
[docker_context]
symbol = ""
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style)'

# ── 时间（薰衣草段）──
[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

# ── 命令耗时（提示符尾部，超过 2 秒才显示）──
[cmd_duration]
disabled = false
show_milliseconds = false
show_notifications = false
style = "bg:lavender fg:crust"
format = '[[  $duration ](fg:crust bg:lavender)]($style)'

# 单行提示符（catppuccin-powerline 默认风格）。
# 想改成「信息一行 + 输入一行」的两行提示符，把下面改成 disabled = false
[line_break]
disabled = true

# ── 提示符号 ──
[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# ── TokyoNight 调色板（完整命名版，四套）──
# 两组色名：
#  1) 语义槽位——powerline 各段直接引用，请勿删/改名：
