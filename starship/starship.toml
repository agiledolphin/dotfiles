#       green→语言段        sapphire→Docker段  lavender→时间段
#       crust→亮色块上的文字色（深色变体=暗背景；Day=亮背景）
#  2) 原生色 / 中性色——额外可选，给自定义段使用：
#       orange blue cyan teal purple magenta pink
#       comment fg fg_dark bg bg_dark surface
